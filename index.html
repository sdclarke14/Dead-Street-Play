const IM={}, PACKS=window.__PACKS||{}, PACKED=Object.keys(PACKS).length>0, PK_DONE={}, PK_Q={}, PK_PROG={};
let packErr=null;
const packURL=n=>'assets/'+n+'.json?v='+BUILD;

function decodePack(obj){
  return Promise.all(Object.entries(obj||{}).map(([k,src])=>new Promise(res=>{
    const i=new Image(); i.onload=()=>{IM[k]=i;res()}; i.onerror=()=>res(); i.src=src;

}
async function fetchPack(n){                                  // streamed so the loading bar is real, not a guess

function vN(m,type,f0,f1,q,gain,dur,delay=0){ const t=AC.currentTime+delay, s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
  s.buffer=noiseBuf(); f.type=type; f.frequency.setValueAtTime(Math.max(40,f0*m.f),t); if(f1) f.frequency.exponentialRampToValueAtTime(Math.max(40,f1*m.f),t+dur); f.Q.value=q;
  g.gain.setValueAtTime(gain*m.v,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(f); f.connect(g); g.connect(master()); s.start(t,Math.random()*.4); s.stop(t+dur+.03); }

  g.gain.setValueAtTime(gain*m.v,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g); g.connect(master()); o.start(t); o.stop(t+dur+.03); }

function gunSfx(e){ if(muted||!AC) return; try{
  const m={v:1,f:1,p:1}, sx=e.sx||{}, fx=e.fx||{}; m.p=.96+Math.random()*.08;
  if(sx.supp){ m.v*=.5; m.f*=.45; } if(sx.comp) m.v*=1.15; if(sx.hbarrel) m.p*=.86; if(sx.flash) m.f*=.9; if(sx.brake) m.v*=1.1; if(sx.berserk) m.p*=.8;
  if(GUNSMP[e.n]&&BUF[GUNSMP[e.n][0]]) m.v*=.4;   // a real sample carries it; the synth just adds bite
  (VOX[e.n]||VOX.PISTOL)(m);
  if(sx.supp) vN(m,'bandpass',900,400,.7,.12,.12);                                         // soft "pfft" tail
  if(e.laser) vO(m,'sine',2600,1300,.05,.07,.012);                                         // laser "pip"
  if(e.boom||sx.gl_mod) { vO(m,'sine',100,32,.2,.3,.02); vN(m,'lowpass',500,100,.6,.2,.12,.02); }
  if(e.chain||sx.alien_lens){ for(let k=0;k<2;k++) vN(m,'highpass',3500,2000,.7,.12,.02,.01+k*.02); vO(m,'sawtooth',1500,400,.05,.07,.01); }
  if(fx.cryo) { vO(m,'sine',3400,2600,.14,.05,.01); vO(m,'sine',4300,3300,.1,.035,.03); }
  if(fx.burn) vN(m,'bandpass',1500,500,.4,.13,.14,.01);

  if(sx.void||sx.xeno_eye||sx.hive_mag||sx.quantum){ vO(m,'sawtooth',110,330,.2,.1,.01,28); vO(m,'sawtooth',112,300,.2,.08,.01,-28); }

const BUF={}, MUS={node:null,pending:null,want:null,el:null,mg:null}, SCD={};
function loadAudio(){
  if(!AC) return;
  if(!MUS.mg){ MUS.mg=AC.createGain(); MUS.mg.gain.value=0; MUS.mg.connect(AC.destination); }
  Object.keys(AUDIO_FILES).forEach(k=>{ if(k in BUF) return; BUF[k]=null;
    fetch(AUDIO_BASE+AUDIO_FILES[k]).then(r=>{ if(!r.ok) throw 0; return r.arrayBuffer(); })
      .then(a=>new Promise((ok,no)=>AC.decodeAudioData(a,ok,no))).then(b=>{ BUF[k]=b; }).catch(()=>{ BUF[k]=false; });
  });
}
function playSample(k,o){
  o=o||{}; const b=BUF[k]; if(muted||!AC||!b) return;
  const now=AC.currentTime; if(SCD[k]&&now<SCD[k]) return; SCD[k]=now+(o.cool||0);
  try{
    const s=AC.createBufferSource(), g=AC.createGain(); s.buffer=b; s.playbackRate.value=o.rate||1;
    g.gain.setValueAtTime(o.vol||.5,now); if(o.dur) g.gain.linearRampToValueAtTime(0,now+o.dur);
    s.connect(g); g.connect(AC.destination); s.start(now); if(o.dur) s.stop(now+o.dur+.02);
  }catch(e){}
}
function musicLevel(){ return musicOff?0:((state==='pause'||state==='dead')?.1:.3); }
function switchMusic(key){
  const t=AC.currentTime, old=MUS.node;
  if(old){ old.g.gain.cancelScheduledValues(t); old.g.gain.setValueAtTime(old.g.gain.value,t); old.g.gain.linearRampToValueAtTime(0,t+.9); try{ old.s.stop(t+.95); }catch(e){} MUS.node=null; }
  if(MUS.el){ MUS.el.pause(); MUS.el=null; }
  MUS.pending=key;
}
function startMusic(){
  const key=MUS.pending; if(!key||MUS.node||MUS.el) return; const b=BUF[key];
  if(b){ const t=AC.currentTime, s=AC.createBufferSource(), g=AC.createGain(); s.buffer=b; s.loop=true; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(1,t+.9); s.connect(g); g.connect(MUS.mg); s.start(t); MUS.node={s,g}; MUS.pending=null; }
  else if(b===false){ try{ const el=new Audio(AUDIO_BASE+AUDIO_FILES[key]); el.loop=true; el.volume=musicLevel(); el.play().catch(()=>{}); MUS.el=el; MUS.pending=null; }catch(e){ MUS.pending=null; } }   // fallback (e.g. opened from file://)
}
function musicTick(dt){
  if(!AC||AC.state!=='running'||!MUS.mg) return;
  const menuMode=state==='layout'||state==='title'||state==='custom'||state==='shop'||state==='store'||state==='challenges'||state==='missions'||state==='loadout'||state==='stats'||state==='win'||(state==='settings'&&settingsFrom!=='pause');
  const want=menuMode?'menu':'b'+(((stage-1)%4)+4)%4;
  if(want!==MUS.want){ MUS.want=want; switchMusic(want); }
  startMusic();
  const lv=musicLevel(); MUS.mg.gain.value+=(lv-MUS.mg.gain.value)*Math.min(1,dt*4);
  if(MUS.el) MUS.el.volume=MUS.mg.gain.value;
}
document.addEventListener('visibilitychange',()=>{ try{ if(!AC) return; if(document.hidden) AC.suspend(); else AC.resume(); if(MUS.el){ document.hidden?MUS.el.pause():MUS.el.play().catch(()=>{}); } }catch(e){} });

function drawHelp(){

  const P=ovPanel(pw,ph,'HOW TO PLAY','#ffd24a'), max=PORT?44:62, fz=PORT?15:16;
  txt((helpPage+1)+' / '+HELP.length,P.x+pw-18,P.y+36,PORT?12:13,'#8a8f6a','right',false);

  else {
    txt(pg.t,W/2,P.y+70,PORT?21:22,'#7dffb0'); y=P.y+84;
    if(pg.art){ const aw=pw-36, ah=PORT?206:156; ctx.save(); rrx(P.x+18,y,aw,ah,12); ctx.clip(); pg.art(P.x+18,y,aw,ah); ctx.restore();

    else y=P.y+104;

  pg.l.forEach(L=>{ if(L===''){ y+=8; return; } wrapLn(L,max).forEach(wq=>{ txt(wq,P.x+(PORT?26:40),y,fz,'#e6ecf8','left',false); y+=fz+7; }); });

  for(let k=0;k<HELP.length;k++){ ctx.fillStyle=k===helpPage?'#ffd24a':'#3a4258'; ctx.beginPath(); ctx.arc(W/2+(k-(HELP.length-1)/2)*sp,P.y+ph-66,dr,0,7); ctx.fill(); }

  ovBtn(P.x+16,by,bw,40,'CLOSE',()=>closeHelp(),{size:15,fill:'#3a2a2a',stroke:'#a07a6a'});
