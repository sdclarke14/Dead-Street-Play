<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dead Street">
<meta name="theme-color" content="#0b0d12">
<title>Dead Street</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d12;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw,calc(100vh*16/9));width:min(100vw,calc(100dvh*16/9));height:auto;aspect-ratio:16/9;image-rendering:pixelated;background:#000;display:block}
  #touch{position:fixed;inset:0;pointer-events:none;display:none}
  #touch button{pointer-events:auto;position:absolute;width:78px;height:78px;border-radius:50%;border:2px solid #ffffff66;background:#00000070;color:#fff;font:700 14px ui-monospace,monospace;touch-action:none;-webkit-user-select:none;user-select:none}
  #rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0b0d12;color:#ffe08a;font:700 22px ui-monospace,monospace;text-align:center;padding:24px;z-index:9}
  @media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
  #touch button:active{background:#ffffff44}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<div id="touch">
  <button data-k="left"  style="left:max(16px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom))">◀</button>
  <button data-k="right" style="left:calc(max(16px,env(safe-area-inset-left)) + 92px);bottom:max(18px,env(safe-area-inset-bottom))">▶</button>
  <button data-k="jump"  style="right:calc(max(16px,env(safe-area-inset-right)) + 112px);bottom:calc(max(18px,env(safe-area-inset-bottom)) + 62px)">JUMP</button>
  <button data-k="fire"  style="right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:100px;height:100px;background:#b0202080">FIRE</button>
  <button data-k="use"   style="right:calc(max(16px,env(safe-area-inset-right)) + 112px);bottom:max(18px,env(safe-area-inset-bottom))">USE</button>
  <button data-k="next"  style="right:max(16px,env(safe-area-inset-right));bottom:calc(max(18px,env(safe-area-inset-bottom)) + 112px);width:64px;height:64px">GUN</button>
  <button data-k="msl" id="mslBtn" style="display:none;right:calc(max(16px,env(safe-area-inset-right)) + 112px);bottom:calc(max(18px,env(safe-area-inset-bottom)) + 124px);width:64px;height:64px;background:#a05010a0">MSL</button>
  <button data-k="pause" style="left:calc(max(16px,env(safe-area-inset-left)) + 250px);top:max(8px,env(safe-area-inset-top));width:44px;height:44px;font-size:12px">||</button>
</div>

let stage=1, kills=0, spawned=0, quota=25, spawnT=0, stageT=0;
let owned=[true,...Array(9).fill(false)], ammo=GUNS.map(g=>g.max===Infinity?Infinity:0);
let p, zs=[], bullets=[], slimes=[], parts=[], drops=[], floats=[], conts=[], perks=[], missiles=[];
let cam=0, shake=0, banner=null, snap=null, deadT=0, clearT=0, midDone=false, rng=Math.random, god=Q.has('god');
let bestStage=1; try{ bestStage=+localStorage.getItem('ds_best')||1; }catch(e){}

function newPlayer(x){ const t=pendingJet; pendingJet=0; return {x:x,y:GROUND,vx:0,vy:0,hp:100,facing:1,gun:0,cd:0,inv:0,slime:0,flash:0,ground:true,step:0,airT:0,thrust:false,mcd:0,shield:0,pk:{dmg:0,speed:0,rapid:0},jet:{tier:t,fuel:FUEL[t],mis:MIS[t]}}; }

/* ---------- stage setup ---------- */
function genStage(s, rngSeedBump=0){
  stage=s; quota=quotaFor(s); kills=0; spawned=0; spawnT=1.2; stageT=0; midDone=false;
  zs=[];bullets=[];slimes=[];parts=[];drops=[];floats=[];missiles=[];
  rng=mulberry(s*7919+13+rngSeedBump);
  // containers: spaced 380+ apart across the world
  conts=[]; const kinds=['gun','med','ammo','ammo','rand','rand'];
  const xs=[]; for(let k=0;k<6;k++) xs.push(540+k*((WORLD-1080)/5)+(rng()-.5)*120);
  xs.sort((a,b)=>a-b);
  // gun container = the one closest to the start point (x=320)
  let gi=0; xs.forEach((x,i)=>{ if(Math.abs(x-320)<Math.abs(xs[gi]-320)) gi=i; });
  const rest=kinds.slice(1).sort(()=>rng()-.5); let ri=0;
  xs.forEach((x,i)=>conts.push({x, type:(i%2===0)?'house':'car', kind:i===gi?'gun':rest[ri++], done:false}));
  // perk crates: hovering drones. low ones can be shot or touched, the high one needs a jump (or the jetpack)
  perks=[]; const jt={2:1,5:2,9:3}[s];
  for(let k=0;k<3;k++){
    const x=620+k*((WORLD-1240)/2)+(rng()-.5)*220, high=(k===1);
    const kind=(jt&&k===0)?'jet':['dmg','shield','speed','rapid','fuel'][Math.floor(rng()*5)];
    perks.push({x,y:GROUND-(high?190:76),cy:GROUND-(high?190:76),kind,hp:3,open:false,ph:rng()*6,jt:(k===0&&jt)?jt:0});
  }
}
function startStage(s){
  genStage(s); p=p?Object.assign(p,{x:320,y:GROUND,vx:0,vy:0,hp:100,slime:0,inv:1.2,shield:0,pk:{dmg:0,speed:0,rapid:0}}):newPlayer(320);
  p.jet.fuel=FUEL[p.jet.tier]; p.jet.mis=MIS[p.jet.tier];
  takeSnap(); const L=locOf(s);
  banner={t:2.4,text:'STAGE '+s,sub:'Kill '+quota+' zombies'};
  state='play';
  try{ localStorage.setItem('ds_best',String(Math.max(bestStage,s))); bestStage=Math.max(bestStage,s);}catch(e){}
}
function takeSnap(){
  snap={stage,kills,spawned,owned:owned.slice(),ammo:ammo.slice(),gun:p.gun,done:conts.map(c=>c.done),px:p.x,midDone,popen:perks.map(c=>c.open),jet:Object.assign({},p.jet)};
}
function respawn(){
  genStage(snap.stage);
  kills=snap.kills; spawned=snap.kills; midDone=snap.midDone;
  owned=snap.owned.slice(); ammo=snap.ammo.slice();
  conts.forEach((c,i)=>c.done=snap.done[i]); perks.forEach((c,i)=>c.open=!!snap.popen[i]);
  const g=snap.gun; p=newPlayer(snap.px); p.gun=g; p.inv=1.5; p.jet=Object.assign({},snap.jet);
  banner={t:2,text:'CHECKPOINT',sub:'Stage '+stage+' - '+kills+'/'+quota};
  state='play';
}

/* ---------- helpers ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
const bestOwned=()=>{for(let i=9;i>=0;i--) if(owned[i]&&ammo[i]>0) return i; return 0;};
function say(x,y,text,color='#fff'){ floats.push({x,y,t:1.4,text,color}); }
function burst(x,y,col,n=8,sp=180,grav=500){ for(let i=0;i<n;i++){ const a=Math.random()*6.283,s=rnd(.3,1)*sp; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:rnd(.3,.7),max:.7,col,size:rnd(2,5),grav}); } }
function selectGun(i){ if(i>=0&&i<10&&owned[i]){ p.gun=i; sfx(300,.05,'square',.03); } else if(i>=0&&i<10) say(p.x,p.y-110,'Find it in a car or house','#aab'); }
function cycleGun(d){ for(let k=1;k<=10;k++){ const i=(p.gun+d*k+100)%10; if(owned[i]){p.gun=i;sfx(300,.05,'square',.03);return;} } }

/* ---------- spawning ---------- */
function pickType(){
  const r=Math.random();
  if(stage>=3){ // spitters
    const sp=Math.min(.35,.08+stage*.02), fa=Math.min(.4,.15+stage*.02);
    if(r<sp) return 'spitter'; if(r<sp+fa) return 'fast'; return 'slow';
  }
  if(stage>=2) return r<.25?'fast':'slow';
  return 'slow';
}
function spawnZ(){
  const L=cam-70, R=cam+W+70, sides=[]; if(L>40) sides.push(L); if(R<WORLD-40) sides.push(R);
  if(!sides.length) return;
  const x=sides[(Math.random()*sides.length)|0], t=pickType(), d=ZT[t], hs=1+.11*(stage-1), ss=1+.025*(stage-1);
  zs.push({t,x,y:GROUND,hp:d.hp*hs,mhp:d.hp*hs,spd:d.spd*ss*rnd(.9,1.1),dir:1,cd:0,spit:rnd(1,2.2),wind:0,flash:0,kb:0,ph:Math.random()*6,hit:0});
  spawned++;
}

/* ---------- shooting ---------- */
function tryFire(){
  const g=GUNS[p.gun];
  if(p.cd>0) return;
  if(ammo[p.gun]<=0){ p.gun=bestOwned(); say(p.x,p.y-110,'OUT OF AMMO','#ff6a6a'); p.cd=.3; return; }
  p.cd=g.rate*(p.pk.rapid>0?.5:1); if(ammo[p.gun]!==Infinity) ammo[p.gun]--;
  for(let i=0;i<g.pel;i++){
    const a=aimAngle(g)+(Math.random()-.5)*2*g.spr;
    const sp=g.spd*(g.flame?rnd(.7,1):1);
    const mz=(window.__HERO&&window.__HERO.muz&&window.__HERO.muz[p.gun])||[28,-54]; const mzx=mz[0]*HS, mzy=mz[1]*HS;
    bullets.push({x:p.x+p.facing*mzx,y:p.y+mzy+(g.flame?rnd(-6,6):0),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(g.grav?160:0),
      dmg:g.dmg*(p.slime>0?.5:1)*(p.pk.dmg>0?2:1),life:g.life*(g.flame?rnd(.7,1):1),pierce:g.pierce,hit:new Set(),g,r:g.flame?12:(g.splash?7:3)});
  }
  sfx(...g.snd,'square',.05);
  if(g.n==='SHOTGUN'||g.n==='SNIPER'||g.n==='GRENADIER') shake=Math.max(shake,5);
  p.recoil=.08;
  const mzf=(window.__HERO&&window.__HERO.muz&&window.__HERO.muz[p.gun])||[28,-54];
  parts.push({x:p.x+p.facing*(mzf[0]*HS+6),y:p.y+mzf[1]*HS,vx:p.facing*60,vy:0,life:.07,max:.07,col:'#fff2a0',size:g.flame?0:9,grav:0});
}
function aimAngle(g){
  const base=p.facing>0?0:Math.PI;
  if(!(p.jet.tier>0&&!p.ground)||g.grav) return base;            // flying: bullets aim at the nearest zombie in front
  let best=null,bd=1e9; const mz=(window.__HERO&&window.__HERO.muz&&window.__HERO.muz[p.gun])||[28,-54], mx=p.x+p.facing*mz[0]*HS, my=p.y+mz[1]*HS;
  zs.forEach(z=>{ const dx=(z.x-mx)*p.facing; if(dx>20&&dx<bd){bd=dx;best=z;} });
  if(!best) return base;
  const ty=best.y-ZT[best.t].h*.55; let a=Math.atan2(ty-my,Math.abs(best.x-mx)); a=Math.max(-.9,Math.min(.9,a));
  return p.facing>0?a:Math.PI-a;
}
function explode(x,y,g,dmgOverride){
  burst(x,y,'#ffb040',26,320,200); burst(x,y,'#fff3b0',10,200,0); shake=Math.max(shake,12); sfx(70,.35,'sawtooth',.09,-40);
  zs.forEach(z=>{ const d=ZT[z.t]; if(Math.abs(z.x-x)<g.splash+d.w/2 && Math.abs((z.y-d.h/2)-y)<g.splash+60) hurtZ(z,dmgOverride!=null?dmgOverride:g.dmg*(p.slime>0?.5:1),Math.sign(z.x-x)||1,260); });
}
function hurtZ(z,dmg,dir,kb=40){
  z.hp-=dmg; z.flash=.08; z.kb+=dir*kb;
  if(z.hp<=0 && !z.dead){
    z.dead=true; kills++; burst(z.x,z.y-40,ZT[z.t].col,12,220); burst(z.x,z.y-40,'#7a1a1a',6,160);
    sfx(120,.18,'sawtooth',.05,-70);
    if(Math.random()<.14){ drops.push({x:z.x,y:GROUND,kind:Math.random()<.4?'med':'ammo',t:12}); }
  }
}

/* ---------- containers ---------- */
function nearestCont(){
  let b=null,bd=75; conts.forEach(c=>{ const d=Math.abs(c.x-p.x); if(!c.done&&d<bd){bd=d;b=c;} }); return b;
}
function ownedAmmoGuns(){ const l=[]; for(let i=1;i<10;i++) if(owned[i]) l.push(i); return l; }
function giveAmmo(i,mult=1){ if(ammo[i]===Infinity) return; ammo[i]=Math.min(GUNS[i].max,ammo[i]+Math.ceil(GUNS[i].pack*mult)); }
function search(){
  const c=nearestCont(); if(!c) return;
  c.done=true; let kind=c.kind;
  if(kind==='rand') kind=Math.random()<.65?'ammo':'med';
  if(kind==='gun'){ const n=owned.findIndex(o=>!o); if(n===-1) kind='ammo'; else { owned[n]=true; ammo[n]=GUNS[n].pack; p.gun=n; say(c.x,GROUND-150,'FOUND: '+GUNS[n].n+'!','#ffe08a'); sfx(700,.25,'triangle',.06,500); banner={t:2,text:'NEW WEAPON',sub:GUNS[n].n+'  (key '+((n+1)%10)+')'}; } }
  if(kind==='ammo'){ const l=ownedAmmoGuns(); if(!l.length) kind='med'; else { const a=l[(Math.random()*l.length)|0], b=l[(Math.random()*l.length)|0]; giveAmmo(a,1.2); if(b!==a) giveAmmo(b,.8); say(c.x,GROUND-150,'AMMO: '+GUNS[a].n+(b!==a?' + '+GUNS[b].n:''),'#9cd7ff'); sfx(500,.12,'triangle',.05,200);} }
  if(kind==='med'){ p.hp=Math.min(100,p.hp+40); say(c.x,GROUND-150,'MEDKIT +40 HP','#7dff9a'); sfx(600,.2,'triangle',.05,300); }
}

/* ---------- perk crates, jetpack, missiles ---------- */
function openCrate(c){
  c.open=true; let kind=c.kind;
  if(kind==='fuel'&&p.jet.tier<=0) kind=['dmg','shield','speed','rapid'][(Math.random()*4)|0];
  burst(c.x,c.cy,PK[kind].col,28,280,200); burst(c.x,c.cy,'#ffffff',8,200,0); sfx(660,.3,'triangle',.06,600);
  if(kind==='jet'){
    const t=Math.min(3,Math.max(c.jt||0,p.jet.tier+1)); const up=t>p.jet.tier; p.jet.tier=t; p.jet.fuel=FUEL[t]; p.jet.mis=MIS[t];
    banner={t:3.4,text:t===1?'JETPACK ACQUIRED':'JETPACK UPGRADED  Mk'+t,sub:t===1?'Hold JUMP in the air to fly  -  '+FUEL[1]+'s of fuel':t===2?'Twin boosters + homing missiles (press F)':'Heavy frame  -  '+FUEL[3]+'s fuel, '+MIS[3]+' missiles'};
    say(c.x,c.cy-30,up?'JETPACK Mk'+t+'!':'JETPACK REFUELED','#ffb35a');
  } else if(kind==='fuel'){ p.jet.fuel=FUEL[p.jet.tier]; p.jet.mis=MIS[p.jet.tier]; say(c.x,c.cy-30,'FUEL + MISSILES REFILLED','#ffb35a'); }
  else if(kind==='dmg'){ p.pk.dmg=20; say(c.x,c.cy-30,'DOUBLE DAMAGE  20s','#ff7a7a'); }
  else if(kind==='shield'){ p.shield=50; say(c.x,c.cy-30,'SHIELD +50','#5ef2ff'); }
  else if(kind==='speed'){ p.pk.speed=20; say(c.x,c.cy-30,'SPEED BOOST  20s','#ffe84a'); }
  else if(kind==='rapid'){ p.pk.rapid=20; say(c.x,c.cy-30,'RAPID FIRE  20s','#d0a8ff'); }
}
function jetPos(){ const t=p.jet.tier, h=[0,60,66,74][t]*HS; return {t,h,cx:p.x-p.facing*20*HS,cy:p.y-66*HS}; }
function nearestZ(x,dir){ let b=null,bd=1e9; zs.forEach(z=>{ if(z.dead) return; const d=Math.abs(z.x-x)+((z.x-x)*dir<0?400:0); if(d<bd){bd=d;b=z;} }); return b; }
function fireMissile(){
  const J=p.jet; if(J.tier<2||state!=='play'||p.mcd>0) return;
  if(J.mis<=0){ say(p.x,p.y-120,'NO MISSILES','#ff6a6a'); p.mcd=.5; return; }
  const n=J.tier>=3?2:1, dmg=13*(p.slime>0?.5:1)*(p.pk.dmg>0?2:1);
  for(let i=0;i<n&&J.mis>0;i++){ J.mis--; missiles.push({x:p.x-p.facing*14,y:p.y-74-i*8,vx:p.facing*170,vy:-230-i*70,t:0,life:3,dir:p.facing,dmg,tg:null}); }
  p.mcd=J.tier>=3?.35:.6; sfx(200,.3,'sawtooth',.05,300); shake=Math.max(shake,3);
}
function boomMissile(m){ m.dead=true; explode(m.x,m.y,{splash:130,dmg:m.dmg},m.dmg); }

/* ---------- update ---------- */
function hurtP(dmg,src){
  if(p.inv>0||god||state!=='play') return;
  if(p.shield>0){ const a=Math.min(p.shield,dmg); p.shield-=a; dmg-=a; burst(p.x,p.y-50,'#5ef2ff',8,160,0); if(dmg<=0){ p.inv=.3; sfx(500,.1,'triangle',.05,-200); return; } }
  p.hp-=dmg; p.inv=.45; p.flash=.2; shake=Math.max(shake,6); sfx(90,.2,'sawtooth',.07,-40);
  p.vx+=Math.sign(p.x-src)*180; burst(p.x,p.y-50,'#b01818',8,160);
  if(p.hp<=0){ p.hp=0; state='dead'; deadT=0; sfx(60,.6,'sawtooth',.09,-30); }
}
function update(dt){
  if(state==='title'||state==='pause'||state==='win') return;
  if(state==='dead'){ deadT+=dt; if(deadT>1.8) respawn(); stepFx(dt); return; }
  if(state==='clear'){ clearT-=dt; zs.forEach(z=>z.hp=-1); zs=[]; stepFx(dt); if(clearT<=0){ if(stage>=MAXSTAGE){ state='win'; } else { p.hp=100; startStage(stage+1); } } return; }
  stageT+=dt;
  // --- player
  const L=keys.left, R=keys.right; let mv=(R?1:0)-(L?1:0);
  const sl=p.slime>0?.7:1;
  p.vx+=(mv*215*sl*(p.pk.speed>0?1.35:1)-p.vx)*Math.min(1,dt*12);
  if(mv) p.facing=mv;
  if(mouse.down&&mouse.seen){ p.facing=(mouse.x+cam>p.x)?1:-1; }
  if(keys.jump&&p.ground){ p.vy=-560; p.ground=false; sfx(260,.12,'square',.03,200); }
  p.vy+=1600*dt;
  p.airT=p.ground?0:p.airT+dt; const J=p.jet; p.thrust=false;
  if(J.tier>0&&keys.jump&&!p.ground&&p.airT>.12&&J.fuel>0){          // hold jump in the air: fly (burns fuel)
    p.thrust=true; J.fuel=Math.max(0,J.fuel-dt); p.vy=Math.max(p.vy-3300*dt,-300-(J.tier-1)*45);
  } else if(J.tier>0&&!p.ground&&p.vy>340) p.vy=340;                   // jetpack slows the fall
  p.x+=p.vx*dt; p.y+=p.vy*dt;
  if(p.y<GROUND-300){ p.y=GROUND-300; if(p.vy<0) p.vy=0; }
  if(p.y>=GROUND){p.y=GROUND;p.vy=0;p.ground=true;}
  if(p.thrust){ const jp=jetPos(), n=jp.t>=2?2:1; for(let i=0;i<n;i++){ const nx=jp.cx+(n===2?(i?8:-8):0), ny=jp.cy+jp.h/2; parts.push({x:nx,y:ny,vx:rnd(-30,30),vy:rnd(140,260),life:.3,max:.3,col:Math.random()<.5?'#ffb030':'#fff0a0',size:rnd(4,8),grav:0}); if(Math.random()<.4) parts.push({x:nx,y:ny+10,vx:rnd(-20,20),vy:rnd(60,120),life:.6,max:.6,col:'#6a6a72',size:rnd(5,9),grav:-40}); } if(Math.random()<.35) sfx(rnd(70,110),.12,'sawtooth',.03,-20); }
  p.x=Math.max(30,Math.min(WORLD-30,p.x));
  p.cd-=dt; p.inv-=dt; p.flash-=dt; p.slime-=dt; p.mcd-=dt; if(p.recoil>0) p.recoil-=dt;
  p.pk.dmg-=dt; p.pk.speed-=dt; p.pk.rapid-=dt;
  if(p.ground&&Math.abs(p.vx)>20) p.step+=dt*Math.abs(p.vx)/22;
  if(keys.fire||mouse.down) tryFire();
  if(keys._usePressed){ search(); keys._usePressed=false; }
  if(keys._missPressed){ fireMissile(); keys._missPressed=false; }
  const mb=document.getElementById('mslBtn'); if(mb) mb.style.display=p.jet.tier>=2?'block':'none';
  // --- camera
  const tc=Math.max(0,Math.min(WORLD-W,p.x-W/2+p.facing*60)); cam+=(tc-cam)*Math.min(1,dt*6);
  // --- spawning
  spawnT-=dt;
  const cap=Math.min(14,4+Math.floor(stage*.7));
  if(spawnT<=0 && spawned<quota && zs.length<cap){ spawnZ(); spawnT=Math.max(.45,1.7-stage*.09); }
  // --- zombies
  zs.forEach(z=>{
    const d=ZT[z.t], dx=p.x-z.x, dist=Math.abs(dx); z.dir=Math.sign(dx)||1; z.ph+=dt; z.flash-=dt; z.cd-=dt;
    let v=0;
    if(z.t==='spitter'){
      if(dist>380) v=z.spd; else if(dist<250) v=-z.spd*.8;
      z.spit-=dt;
      if(z.spit<=0 && dist<560 && dist>140){ z.wind=.4; z.spit=rnd(2.0,3.0)-Math.min(.9,stage*.05); }
      if(z.wind>0){ z.wind-=dt; v=0; if(z.wind<=0){ slimes.push({x:z.x+z.dir*22,y:GROUND-66,vx:z.dir*(270+stage*6),vy:-20,r:11,life:3}); sfx(300,.2,'sine',.05,-150);} }
    } else v=z.spd;
    z.x+=z.dir*v*dt; // v>0 approaches the player, v<0 backs away
    z.mv=Math.abs(v)>1; if(z.mv) z.walk=(z.walk||0)+dt*ANIM[z.t].rate;
    z.x+=z.kb*dt*4; z.kb*=Math.pow(.001,dt);
    z.x=Math.max(10,Math.min(WORLD-10,z.x));
    // contact
    if(Math.abs(p.x-z.x)<(d.w+26)/2 && p.y>GROUND-d.h*.7 && z.cd<=0){ hurtP(d.dmg,z.x); z.cd=.8; }
  });
  // separate overlapping zombies a little
  for(let i=0;i<zs.length;i++)for(let j=i+1;j<zs.length;j++){ const a=zs[i],b=zs[j],o=26-Math.abs(a.x-b.x); if(o>0){ const s=(a.x<b.x?-1:1)*o*.5; a.x+=s; b.x-=s; } }
  // --- bullets
  bullets.forEach(b=>{
    b.life-=dt; if(b.g.grav) b.vy+=b.g.grav*dt;
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.g.flame) parts.push({x:b.x,y:b.y,vx:rnd(-20,20),vy:rnd(-60,-10),life:.25,max:.25,col:Math.random()<.5?'#ff9a2a':'#ffd24a',size:rnd(5,10),grav:-80});
    else if(b.g.n==='PLASMA') parts.push({x:b.x,y:b.y,vx:0,vy:0,life:.12,max:.12,col:'#5ef2ff',size:4,grav:0});
    if(b.y>GROUND-4 && b.g.splash){ b.life=0; explode(b.x,GROUND-6,b.g,b.dmg); b.dead=true; return; }
    for(const z of zs){
      if(z.dead||b.hit.has(z)) continue; const d=ZT[z.t];
      if(Math.abs(b.x-z.x)<d.w/2+b.r && b.y>z.y-d.h-4 && b.y<z.y+4){
        b.hit.add(z);
        if(b.g.splash){ explode(b.x,b.y,b.g,b.dmg); b.life=0; b.dead=true; break; }
        hurtZ(z,b.dmg,Math.sign(b.vx),b.g.n==='SHOTGUN'?90:b.g.flame?4:30);
        burst(b.x,b.y,'#7a2a2a',3,120);
        if(--b.pierce<=0){ b.life=0; b.dead=true; break; }
      }
    }
  });
  bullets=bullets.filter(b=>b.life>0&&!b.dead&&b.x>-50&&b.x<WORLD+50);
  // --- perk crates (shoot them or touch them)
  perks.forEach(c=>{
    if(c.open) return; c.cy=c.y+Math.sin(c.ph+performance.now()/500)*4;
    for(const b of bullets){ if(b.dead||b.hit.has(c)) continue; if(Math.abs(b.x-c.x)<22+b.r&&Math.abs(b.y-c.cy)<20+b.r){ b.hit.add(c); c.hp-=Math.max(1,b.dmg); burst(b.x,b.y,'#ffffff',4,120,0); if(--b.pierce<=0){b.life=0;b.dead=true;} if(c.hp<=0){ openCrate(c); break; } } }
    if(!c.open&&Math.abs(p.x-c.x)<30&&p.y-HH<c.cy+16&&p.y>c.cy-16) openCrate(c);
  });
  // --- homing missiles
  missiles.forEach(m=>{
    m.t+=dt; m.life-=dt;
    if(!m.tg||m.tg.dead||!zs.includes(m.tg)) m.tg=nearestZ(m.x,m.dir);
    let ang=Math.atan2(m.vy,m.vx); const sp=Math.min(620,220+m.t*1000);
    if(m.t>.15&&m.tg){ const want=Math.atan2((m.tg.y-ZT[m.tg.t].h*.5)-m.y,m.tg.x-m.x); let d=want-ang; while(d>Math.PI)d-=6.2832; while(d<-Math.PI)d+=6.2832; ang+=Math.max(-1,Math.min(1,d))*dt*6; }
    else if(m.t>.15) ang+=(((m.dir>0?0:Math.PI)-ang+9.42)%6.2832-3.1416)*dt*2;
    m.vx=Math.cos(ang)*sp; m.vy=Math.sin(ang)*sp; m.x+=m.vx*dt; m.y+=m.vy*dt; m.a=ang;
    parts.push({x:m.x-Math.cos(ang)*10,y:m.y-Math.sin(ang)*10,vx:rnd(-20,20),vy:rnd(-20,20),life:.45,max:.45,col:Math.random()<.5?'#ffb030':'#9a9aa2',size:rnd(4,8),grav:0});
    if(m.y>GROUND-4||m.life<=0){ boomMissile(m); return; }
    for(const z of zs){ if(z.dead) continue; const d=ZT[z.t]; if(Math.abs(m.x-z.x)<d.w/2+8&&m.y>z.y-d.h-6&&m.y<z.y+6){ boomMissile(m); return; } }
  });
  missiles=missiles.filter(m=>!m.dead);
  // --- slime
  slimes.forEach(s=>{
    s.life-=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=60*dt;
    parts.push({x:s.x,y:s.y,vx:rnd(-20,20),vy:rnd(0,40),life:.35,max:.35,col:'#7dff3a',size:rnd(3,6),grav:200});
    if(Math.abs(s.x-p.x)<s.r+14 && s.y>p.y-84 && s.y<p.y+4){
      s.life=0; if(p.inv<=0&&!god&&state==='play'){ hurtP(12,s.x); p.slime=5; say(p.x,p.y-120,'SLIMED! DMG -50%','#7dff3a'); }
      burst(s.x,s.y,'#7dff3a',12,200);
    }
    if(s.y>GROUND){ s.life=0; burst(s.x,GROUND,'#7dff3a',6,120); }
  });
  slimes=slimes.filter(s=>s.life>0&&s.x>-40&&s.x<WORLD+40);
  zs=zs.filter(z=>!z.dead);
  // --- drops
  drops.forEach(d=>{ d.t-=dt; if(Math.abs(d.x-p.x)<34){ d.t=0;
    if(d.kind==='med'){ p.hp=Math.min(100,p.hp+20); say(d.x,GROUND-90,'+20 HP','#7dff9a'); }
    else { const l=ownedAmmoGuns(); if(l.length){ const a=l[(Math.random()*l.length)|0]; giveAmmo(a,.5); say(d.x,GROUND-90,'+AMMO '+GUNS[a].n,'#9cd7ff'); } else { p.hp=Math.min(100,p.hp+10); say(d.x,GROUND-90,'+10 HP','#7dff9a'); } }
    sfx(700,.1,'triangle',.04,300);
  }});
  drops=drops.filter(d=>d.t>0);
  stepFx(dt);
  // --- progress
  if(!midDone && kills>=Math.ceil(quota/2) && kills<quota){ midDone=true; takeSnap(); banner={t:2,text:'CHECKPOINT',sub:'Progress saved'}; sfx(800,.2,'triangle',.05,400); }
  if(kills>=quota && state==='play'){ state='clear'; clearT=2.6; sfx(500,.5,'triangle',.06,700); }
}
function stepFx(dt){
  parts.forEach(q=>{q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.grav*dt;});
  parts=parts.filter(q=>q.life>0);
  floats.forEach(f=>{f.t-=dt;f.y-=28*dt}); floats=floats.filter(f=>f.t>0);
  if(banner){banner.t-=dt;if(banner.t<=0)banner=null}
  shake=Math.max(0,shake-dt*30);
}

function spr(img,cx,feet,h,flip,filter){
  if(!img) return false;
  const w=img.width*h/img.height;
  ctx.save(); if(filter) ctx.filter=filter;

  ctx.drawImage(img,-w/2,-h,w,h); ctx.restore(); return true;
}
const ANIM={ slow:{rate:5.5,shear:.22,sway:.04,bob:2,lean:.03}, fast:{rate:14,shear:.42,sway:.05,bob:4.5,lean:.17}, spitter:{rate:6.5,shear:.18,sway:.07,bob:2.5,lean:.02} };
// walk-cycle from one still sprite: legs swing from the hip, torso bobs/sways/leans over them
function aspr(img,cx,feet,h,flip,a,filter){
  if(!img) return false;
  const w=img.width*h/img.height, ox=-w*(a.ax==null?.5:a.ax), r=a.split||.6, th=h*r, bh=h-th, sy=img.height*r, s=Math.sin(a.ph), ab=Math.abs(s);
  ctx.save(); if(filter) ctx.filter=filter;
  ctx.translate(cx,feet); if(flip) ctx.scale(-1,1);
  // legs: pivot at the hip, feet swing and lift
  ctx.save(); ctx.translate(0,-bh); ctx.transform(1,0,s*a.shear,1-.05*ab,0,0);
  ctx.drawImage(img,0,sy-2,img.width,img.height-sy+2,ox,-2*h/img.height,w,bh+2*h/img.height); ctx.restore();
  // torso: pivots at the hip
  ctx.save(); ctx.translate(0,-bh-ab*a.bob); ctx.rotate(a.fwd*a.lean+Math.sin(a.ph*2)*a.sway*.6+s*a.sway*.4);
  ctx.drawImage(img,0,0,img.width,sy,ox,-th,w,th); ctx.restore();
  ctx.restore(); return true;
}

  if(shake>0) ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  drawBG(); drawGround(); drawConts();
  drawCrates(); zs.slice().sort((a,b)=>a.y-b.y).forEach(drawZ); drawJet(); drawHero(); drawMissiles(); drawFx();
  if(p.shield>0){ const sx=p.x-cam; ctx.strokeStyle='rgba(94,242,255,'+(.45+.25*Math.sin(performance.now()/120))+')'; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(sx,p.y-48,34,56,0,0,7); ctx.stroke(); ctx.fillStyle='rgba(94,242,255,.10)'; ctx.fill(); }
  ctx.restore();
  // dusk vignette
  const v=ctx.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*.95); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.45)'); ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=LOCS[locOf(stage)].grades[subOf(stage)]; ctx.fillRect(0,0,W,H);
  if(p.slime>0){ ctx.fillStyle='rgba(125,255,58,'+Math.min(.18,p.slime*.05)+')'; ctx.fillRect(0,0,W,H); }
  if(p.flash>0){ ctx.fillStyle='rgba(220,20,20,'+Math.min(.3,p.flash*1.5)+')'; ctx.fillRect(0,0,W,H); }
  drawHUD();
  if(state==='pause'){ overlay(.6); txt('PAUSED',W/2,240,56,'#ffe08a'); txt('P to resume',W/2,280,18,'#fff'); }
  if(state==='dead'){ overlay(Math.min(.7,deadT*.6)); txt('YOU DIED',W/2,230,64,'#e83a3a'); txt('Back to last checkpoint...',W/2,272,20,'#fff'); }
  if(state==='clear'){ overlay(.35); txt('STAGE '+stage+' CLEARED',W/2,240,52,'#8fd13a'); txt(stage>=MAXSTAGE?'...':'Next: stage '+(stage+1)+'  -  life restored',W/2,280,20,'#fff'); }
  if(state==='win'){ overlay(.75); txt('YOU SURVIVED',W/2,220,64,'#ffe08a'); txt('All 15 stages cleared. The street is quiet.',W/2,266,22,'#fff'); txt('Press ENTER to play again',W/2,320,20,'#9cd7ff'); }
}

/* ---------- input ---------- */
const MAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'fire',KeyJ:'fire',KeyK:'fire',KeyE:'use'};
function startNew(){ owned=[true,...Array(9).fill(false)]; ammo=GUNS.map(g=>g.max===Infinity?Infinity:0); p=null; startStage(1); }
function startCont(){ owned=[true,...Array(9).fill(false)]; ammo=GUNS.map(g=>g.max===Infinity?Infinity:0);
  // continuing grants the guns a player would plausibly have found by that stage
  for(let i=1;i<Math.min(10,bestStage);i++){ owned[i]=true; ammo[i]=Math.ceil(GUNS[i].max*.5); }
  pendingJet=bestStage>=10?3:bestStage>=6?2:bestStage>=3?1:0;
  p=null; startStage(bestStage); }
addEventListener('keydown',e=>{
  initAudio();
  if(MAP[e.code]){ keys[MAP[e.code]]=true; if(MAP[e.code]==='use'&&!e.repeat) keys._usePressed=true; if(e.code==='Space'||e.code.startsWith('Arrow')) e.preventDefault(); }
  if(state==='title'||state==='win'){ if(e.code==='Enter'||e.code==='Space'){ startNew(); } if(e.code==='KeyC'&&state==='title'&&bestStage>1) startCont(); return; }
  if(e.code==='KeyP'||e.code==='Escape'){ if(state==='play') state='pause'; else if(state==='pause') state='play'; }
  if(e.code==='KeyM') muted=!muted;
  if(state!=='play') return;
  if(e.code.startsWith('Digit')){ const n=+e.code.slice(5); selectGun(n===0?9:n-1); }
  if(e.code==='KeyQ') cycleGun(-1); if(e.code==='KeyR') cycleGun(1);
  if((e.code==='KeyF'||e.code==='KeyX')&&!e.repeat) keys._missPressed=true;
});
addEventListener('keyup',e=>{ if(MAP[e.code]) keys[MAP[e.code]]=false; });
addEventListener('blur',()=>{ Object.keys(keys).forEach(k=>keys[k]=false); mouse.down=false; if(state==='play') state='pause'; });
cv.addEventListener('contextmenu',e=>e.preventDefault());
function mpos(e){ const r=cv.getBoundingClientRect(); mouse.x=(e.clientX-r.left)*W/r.width; mouse.y=(e.clientY-r.top)*H/r.height; mouse.seen=true; }
cv.addEventListener('pointermove',mpos);
cv.addEventListener('pointerdown',e=>{ initAudio(); mpos(e); if(state==='title'){ if(e.clientY>cv.getBoundingClientRect().top+cv.getBoundingClientRect().height*.62&&bestStage>1) startCont(); else startNew(); return; } if(state==='win'){ startNew(); return; } mouse.down=true; });
addEventListener('pointerup',()=>{ mouse.down=false; });
addEventListener('wheel',e=>{ if(state==='play') cycleGun(e.deltaY>0?1:-1); },{passive:true});
if('ontouchstart' in window || navigator.maxTouchPoints>0){
  const t=document.getElementById('touch'); t.style.display='block';
  t.querySelectorAll('button').forEach(b=>{ const k=b.dataset.k;
    const on=e=>{ e.preventDefault(); initAudio(); if(state==='title'||state==='win'){ startNew(); return; } if(k==='next'){ cycleGun(1); return; } if(k==='msl'){ keys._missPressed=true; return; } if(k==='pause'){ if(state==='play') state='pause'; else if(state==='pause') state='play'; return; } keys[k]=true; if(k==='use') keys._usePressed=true; };
    const off=e=>{ e.preventDefault(); if(k!=='next'&&k!=='pause'&&k!=='msl') keys[k]=false; };
    b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointerleave',off); b.addEventListener('pointercancel',off); });
}

document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
['gesturestart','gesturechange','dblclick'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000); last=now;
  try{ update(dt); render(); }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
function boot(){
  p=newPlayer(320); genStage(1); state='title';
  // debug / test hooks: ?stage=N&god&allguns
  const qs=+Q.get('stage')||0; if(Q.has('jet')) pendingJet=Math.max(0,Math.min(3,+Q.get('jet')||1));
  if(Q.has('allguns')){ owned=owned.map(()=>true); ammo=GUNS.map(g=>g.max); }
  if(qs>=1&&qs<=MAXSTAGE){ if(!Q.has('allguns')){ for(let i=1;i<Math.min(10,qs);i++){owned[i]=true;ammo[i]=GUNS[i].max;} } p=null; startStage(qs); }
  window.__g={get s(){return {state,stage,kills,quota,hp:p&&p.hp,gun:p&&p.gun,zs:zs.length,owned:owned.slice(),ammo:ammo.slice(),conts:conts.map(c=>({x:c.x,kind:c.kind,done:c.done})),px:p&&p.x,slime:p&&p.slime,spawned,cam,jet:p&&Object.assign({},p.jet),thrust:p&&p.thrust,py:p&&p.y,perks:perks.map(c=>({k:c.kind,x:c.x,open:c.open})),missiles:missiles.length,shield:p&&p.shield,pk:p&&Object.assign({},p.pk)}},
    set:(o)=>{ if(o.hp!=null)p.hp=o.hp; if(o.kills!=null)kills=o.kills; if(o.px!=null)p.x=o.px; if(o.slime!=null)p.slime=o.slime; if(o.py!=null)p.y=o.py; if(o.jetTier!=null){p.jet.tier=o.jetTier;p.jet.fuel=FUEL[o.jetTier];p.jet.mis=MIS[o.jetTier];} },
    spawn:(t,x)=>{ zs.push({t,x,y:GROUND,hp:ZT[t].hp,mhp:ZT[t].hp,spd:ZT[t].spd,dir:1,cd:0,spit:.1,wind:0,flash:0,kb:0,ph:0}); spawned++; },
    start:startNew, key:(k,v)=>keys[k]=v};
  requestAnimationFrame(frame);
}
loadImgs().then(boot);
})();
</script>
