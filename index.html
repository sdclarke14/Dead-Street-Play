/* hero recolor: the build ships a body-part label map per sprite (skin/hair/jacket/collar/pants/boots); we repaint from the original pixels */
const HB={};
function prepHero(){ for(let i=0;i<10;i++){ const im=IM['hero_'+i], mk=IM['hm_'+i]; if(!im||!mk||HB[i]) continue;
    const c=document.createElement('canvas'); c.width=im.width; c.height=im.height; const g=c.getContext('2d'); g.drawImage(im,0,0); const d=g.getImageData(0,0,c.width,c.height);
    const c2=document.createElement('canvas'); c2.width=im.width; c2.height=im.height; const g2=c2.getContext('2d'); g2.drawImage(mk,0,0); const m=g2.getImageData(0,0,c.width,c.height).data;
    const lab=new Uint8Array(c.width*c.height), sum=new Float64Array(8), cnt=new Float64Array(8);
    for(let k=0;k<lab.length;k++){ const L=Math.round(m[k*4]/30); lab[k]=L; if(L>0&&d.data[k*4+3]>40){ sum[L]+=.3*d.data[k*4]+.59*d.data[k*4+1]+.11*d.data[k*4+2]; cnt[L]++; } }
    HB[i]={w:c.width,h:c.height,orig:d.data,lab,base:Array.from(sum,(v,j)=>cnt[j]?v/cnt[j]:128)}; } }
function heroColors(){ const e=prof.equip, o=ITEM[e.outfit], pick=sl=>{ const it=ITEM[e[sl]]; return it&&it.c?hexRGB(it.c):null; };
  const hasO=o&&o.j; return {1:pick('skin'),2:pick('hair'),3:hasO?hexRGB(o.j):pick('jacket'),5:hasO?hexRGB(o.p):pick('pants'),6:hasO?hexRGB(o.b):pick('boots')}; }
function paintHero(){ prepHero(); const col=heroColors(); if(col[3]) col[4]=col[3].map(v=>Math.min(255,v*.45+255*.55));   // collar follows the jacket, lighter
  for(let i=0;i<10;i++){ const h=HB[i]; if(!h) continue; if(!h.cv){ h.cv=document.createElement('canvas'); h.cv.width=h.w; h.cv.height=h.h; }
    const out=new Uint8ClampedArray(h.orig); for(let k=0;k<h.lab.length;k++){ const L=h.lab[k], t=L?col[L]:null; if(!t||out[k*4+3]<=40) continue;
      const lum=.3*h.orig[k*4]+.59*h.orig[k*4+1]+.11*h.orig[k*4+2], f=Math.max(.25,Math.min(1.9,lum/Math.max(1,h.base[L])));
      out[k*4]=Math.min(255,t[0]*f); out[k*4+1]=Math.min(255,t[1]*f); out[k*4+2]=Math.min(255,t[2]*f); }
    h.cv.getContext('2d').putImageData(new ImageData(out,h.w,h.h),0,0); IM['hero_'+i]=h.cv; } }

/* ---------- stage setup ---------- */
function genStage(s, rngSeedBump=0){
  stage=s; quota=quotaFor(s); kills=0; spawned=0; spawnT=1.2; stageT=0; midDone=false;
  zs=[];bullets=[];slimes=[];parts=[];drops=[];floats=[];missiles=[];obst=[];coins=[];
  rng=mulberry(s*7919+13+rngSeedBump);
  // containers: spaced 380+ apart across the world
  conts=[]; const kinds=['gun','med','ammo','ammo','rand','rand'];
  const xs=[]; for(let k=0;k<6;k++) xs.push(540+k*((WORLD-1080)/5)+(rng()-.5)*120);
  xs.sort((a,b)=>a-b);
  // gun container = the one closest to the start point (x=320)
  let gi=0; xs.forEach((x,i)=>{ if(Math.abs(x-320)<Math.abs(xs[gi]-320)) gi=i; });
  const rest=kinds.slice(1).sort(()=>rng()-.5); let ri=0;
  xs.forEach((x,i)=>conts.push({x, type:(i%2===0)?'house':'car', kind:i===gi?'gun':rest[ri++], done:false}));
  // ---- obstacles: platforms to hop onto, hazards, explosive barrels, and extra loot (dumpsters, lockers, caches)
  const aspect=(n,w,lo,hi,dflt)=>{ const im=IM[n]; return im?Math.max(lo,Math.min(hi,Math.round(w*im.height/im.width))):dflt; };
  const addP=(type,x,w,h,hidden)=>{ obst.push({k:'plat',type,x,w,h,top:GROUND-h,hidden:!!hidden}); return h; };
  const gaps=[852,1476,2100,2724,3348];                                  // midpoints between the houses/cars
  // course A: crate -> crate stack -> bus roof (cache on top).  Every step is within one jump (about 98px).
  { const x0=gaps[1]-170; addP('crate',x0,70,64); addP('crate',x0+86,70,128); const bh=addP('bus',x0+210,190,aspect('plat_bus',190,84,125,108)); conts.push({x:x0+210,y:GROUND-bh,type:'cache',kind:'cache',done:false}); }
  // course B: rubble -> stack of 2 -> stack of 3 (cache on top)
  { const x0=gaps[3]-150, rh=aspect('plat_rubble',120,40,70,56); addP('rubble',x0,120,rh); addP('crate',x0+120,70,128); addP('crate',x0+206,70,192); conts.push({x:x0+206,y:GROUND-192,type:'cache',kind:'cache',done:false}); }
  // hazards on the road (jump over them, or lure zombies into them) + one explosive barrel near each
  const hz=['wire','fire','tox'].sort(()=>rng()-.5);
  [gaps[0],gaps[2],gaps[4]].forEach((gx,i)=>{
    const t=hz[i]; obst.push({k:'haz',type:t,x:gx,w:t==='fire'?40:150,h:t==='fire'?64:(t==='wire'?34:26),t:0});
    obst.push({k:'barrel',type:'barrel',x:gx+(rng()<.5?-1:1)*(110+rng()*30),w:36,h:56,hp:2,fuse:null,dead:false});
  });
  // gold coins: trails over the climbing courses and arcs above hazards (a reward for hopping around)
  const cv_=1+Math.floor(s/4), addC=(x,y)=>coins.push({x,y,v:cv_,got:false,ph:rng()*6});
  obst.filter(o=>o.k==='plat'&&!o.hidden).forEach(o=>{ addC(o.x-12,o.top-34); addC(o.x+12,o.top-34); });
  obst.filter(o=>o.k==='haz').forEach(o=>{ addC(o.x-44,GROUND-52); addC(o.x-18,GROUND-96); addC(o.x+18,GROUND-96); addC(o.x+44,GROUND-52); });
  for(let k=0;k<3;k++){ const x0=gaps[k===0?0:k===1?2:4]-300-k*60; for(let j=0;j<5;j++) addC(x0+j*30,GROUND-30); }
  // extra lootables beyond houses and cars
  addP('dumpster',gaps[0]-170,90,56,true); conts.push({x:gaps[0]-170,type:'dumpster',kind:'rand',done:false});
  conts.push({x:gaps[4]+150,type:'locker',kind:'locker',done:false});
  // perk crates: hovering drones. low ones can be shot or touched, the high one needs a jump (or the jetpack)
  perks=[]; const jt={2:1,5:2,9:3}[s];
  for(let k=0;k<3;k++){
    const x=620+k*((WORLD-1240)/2)+(rng()-.5)*220, high=(k===1);
    const kind=(jt&&k===0)?'jet':['dmg','shield','speed','rapid','fuel'][Math.floor(rng()*5)];
    perks.push({x,y:GROUND-(high?190:76),cy:GROUND-(high?190:76),kind,hp:3,open:false,ph:rng()*6,jt:(k===0&&jt)?jt:0});
  }
}
function startStage(s){
  stageGain={xp:0,gold:0};
  genStage(s); p=p?Object.assign(p,{x:320,y:GROUND,vx:0,vy:0,hp:maxHP(),slime:0,inv:1.2,shield:0,pk:{dmg:0,speed:0,rapid:0}}):newPlayer(320);
  p.jet.fuel=fuelMax(p.jet.tier); p.jet.mis=MIS[p.jet.tier];
  takeSnap(); const L=locOf(s);
  banner=subOf(s)===0?{t:3,text:LOCS[L].n,sub:'Stage '+s+'  -  kill '+quota+' zombies'}:{t:2.4,text:'STAGE '+s,sub:LOCS[L].n+'  -  kill '+quota+' zombies'};
  state='play';
  try{ localStorage.setItem('ds_best',String(Math.max(bestStage,s))); bestStage=Math.max(bestStage,s);}catch(e){}
}
function takeSnap(){
  snap={stage,kills,spawned,owned:owned.slice(),ammo:ammo.slice(),gun:p.gun,done:conts.map(c=>c.done),px:p.x,midDone,popen:perks.map(c=>c.open),cgot:coins.map(c=>c.got),jet:Object.assign({},p.jet)};
}
function respawn(){
  genStage(snap.stage);
  kills=snap.kills; spawned=snap.kills; midDone=snap.midDone;
  owned=snap.owned.slice(); ammo=snap.ammo.slice();
  conts.forEach((c,i)=>c.done=snap.done[i]); perks.forEach((c,i)=>c.open=!!snap.popen[i]); coins.forEach((c,i)=>{ if(snap.cgot&&snap.cgot[i]) c.got=true; });
  const g=snap.gun; p=newPlayer(snap.px); p.gun=g; p.inv=1.5; p.jet=Object.assign({},snap.jet);
  banner={t:2,text:'CHECKPOINT',sub:'Stage '+stage+' - '+kills+'/'+quota};
  state='play';
}

/* ---------- spawning ---------- */
function pickType(){
  const r=Math.random();
  if(stage>=3){ // spitters
    const sp=Math.min(.35,.08+stage*.02), fa=Math.min(.4,.15+stage*.02);
    if(r<sp) return 'spitter'; if(r<sp+fa) return 'fast'; return 'slow';
  }
  if(stage>=2) return r<.25?'fast':'slow';
  return 'slow';
}
function spawnZ(){
  const L=cam-70, R=cam+VW+70, sides=[]; if(L>40) sides.push(L); if(R<WORLD-40) sides.push(R);
  if(!sides.length) return;
  const x=sides[(Math.random()*sides.length)|0], t=pickType(), d=ZT[t], hs=1+.11*(stage-1), ss=1+.025*(stage-1);
  zs.push({t,x,y:GROUND,hp:d.hp*hs,mhp:d.hp*hs,spd:d.spd*ss*rnd(.9,1.1),dir:1,cd:0,spit:rnd(1,2.2),wind:0,flash:0,kb:0,ph:Math.random()*6,hit:0});
  spawned++;
}

function tryFire(){
  const g=GUNS[p.gun];

function spr(img,cx,feet,h,flip,filter){
  if(!img) return false;
  const w=img.width*h/img.height;
  ctx.save(); if(filter) ctx.filter=filter;

  ctx.drawImage(img,-w/2,-h,w,h); ctx.restore(); return true;
}

function aspr(img,cx,feet,h,flip,a,filter){

  ctx.drawImage(img,0,sy-2,img.width,img.height-sy+2,ox,-2*h/img.height,w,bh+2*h/img.height); ctx.restore();
  // torso: pivots at the hip
  ctx.save(); ctx.translate(0,-bh-ab*a.bob); ctx.rotate(a.fwd*a.lean+Math.sin(a.ph*2)*a.sway*.6+s*a.sway*.4);

  ctx.restore(); return true;
}

/* ---------- input ---------- */
const MAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'fire',KeyJ:'fire',KeyK:'fire',KeyE:'use'};
function startNew(){ owned=[true,...Array(9).fill(false)]; ammo=GUNS.map(g=>g.max===Infinity?Infinity:0); p=null; startStage(1); }
function startCont(){ owned=[true,...Array(9).fill(false)]; ammo=GUNS.map(g=>g.max===Infinity?Infinity:0);
  // continuing grants the guns a player would plausibly have found by that stage
  for(let i=1;i<Math.min(10,bestStage);i++){ owned[i]=true; ammo[i]=Math.ceil(GUNS[i].max*.5); }
  pendingJet=bestStage>=10?3:bestStage>=6?2:bestStage>=3?1:0;
  p=null; startStage(bestStage); }
addEventListener('keydown',e=>{
  initAudio();
  if(MAP[e.code]){ keys[MAP[e.code]]=true; if(MAP[e.code]==='use'&&!e.repeat) keys._usePressed=true; if(e.code==='Space'||e.code.startsWith('Arrow')) e.preventDefault(); }
  if(MENU[state]||state==='win'){ if(state==='title'||state==='win'){ if(e.code==='Enter'||e.code==='Space'){ startNew(); } if(e.code==='KeyC'&&state==='title'&&bestStage>1) startCont(); } else if(e.code==='Escape'||(state==='pause'&&e.code==='KeyP')){ if(state==='settings') state=settingsFrom; else if(state==='pause') state='play'; else state='title'; } return; }
  if(e.code==='KeyP'||e.code==='Escape'){ if(state==='play'){ state='pause'; releaseKeys(); } else if(state==='pause') state='play'; }
  if(e.code==='KeyM'){ muted=!muted; prof.muted=muted; saveProfile(); }
  if(state!=='play') return;
  if(e.code.startsWith('Digit')){ const n=+e.code.slice(5); selectGun(n===0?9:n-1); }
  if(e.code==='KeyQ') cycleGun(-1); if(e.code==='KeyR') cycleGun(1);
  if((e.code==='KeyF'||e.code==='KeyX')&&!e.repeat) keys._missPressed=true;
});
addEventListener('keyup',e=>{ if(MAP[e.code]) keys[MAP[e.code]]=false; });
addEventListener('blur',()=>{ Object.keys(keys).forEach(k=>keys[k]=false); mouse.down=false; if(state==='play') state='pause'; });
cv.addEventListener('contextmenu',e=>e.preventDefault());
const ptrs=new Map(), HOLD={left:1,right:1,jump:1,fire:1,use:1};
function toLogical(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]; }
function btnAt(x,y){ const l=pbtns(); for(let i=l.length-1;i>=0;i--){ const b=l[i]; if(b.show===false) continue;
  if(b.rect?(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h):Math.hypot(x-b.x,y-b.y)<=b.r+10) return b; } return null; }
function pressBtn(b){ const k=b.k;
  if(k==='pause'){ if(state==='play'){ state='pause'; releaseKeys(); ptrs.clear(); } else if(state==='pause') state='play'; return; }
  if(state!=='play') return;
  if(k==='next') cycleGun(1); else if(k==='msl') keys._missPressed=true; else if(k.startsWith('gun')) selectGun(b.i);
  else { keys[k]=true; if(k==='use') keys._usePressed=true; } }
function releaseBtn(b){ if(b&&HOLD[b.k]) keys[b.k]=false; }
function portDown(e){ const [x,y]=toLogical(e), b=btnAt(x,y); if(!b) return; ptrs.set(e.pointerId,b); try{cv.setPointerCapture(e.pointerId);}catch(_){ } pressBtn(b); }
function portMove(e){ if(!ptrs.has(e.pointerId)) return; const old=ptrs.get(e.pointerId); if(!HOLD[old.k]) return; const [x,y]=toLogical(e), nb=btnAt(x,y);
  if(nb!==old){ releaseBtn(old); if(nb&&HOLD[nb.k]){ ptrs.set(e.pointerId,nb); pressBtn(nb); } else ptrs.delete(e.pointerId); } }
function portUp(e){ const b=ptrs.get(e.pointerId); if(b){ releaseBtn(b); ptrs.delete(e.pointerId); } }
cv.addEventListener('pointermove',portMove); cv.addEventListener('pointerup',portUp); cv.addEventListener('pointercancel',portUp);
function mpos(e){ const r=cv.getBoundingClientRect(); mouse.x=(e.clientX-r.left)*W/r.width; mouse.y=(e.clientY-r.top)*H/r.height; mouse.seen=true; }
cv.addEventListener('pointermove',mpos);
cv.addEventListener('pointerdown',e=>{ initAudio(); mpos(e); if(MENU[state]){ menuTap(e); return; } if(state==='win'){ state='title'; return; } if(PORT||touchDevice){ portDown(e); if(PORT||e.pointerType==='touch') return; } mouse.down=true; });
