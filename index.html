  return Promise.all(Object.entries(obj||{}).map(([k,src])=>new Promise(res=>{
    let tries=0; const go=()=>{ const i=new Image(); i.onload=()=>{IM[k]=i;res()}; i.onerror=()=>{ if(++tries<3) setTimeout(go,350*tries); else { if(n) PK_BAD[n]=(PK_BAD[n]||0)+1; res(); } }; i.src=src; }; go();
  })));
}
let packFixing=false;
function packRepair(){ const L=Object.keys(PK_BAD); if(packFixing||!L.length) return; packFixing=true;
  Promise.all(L.map(n=>{ delete PK_BAD[n]; return fetch(packURL(n),{cache:'force-cache'}).then(r=>r.json()).then(o=>{ const miss={}; for(const k in o) if(!IM[k]) miss[k]=o[k]; return decodePack(miss,n); }).catch(()=>{ PK_BAD[n]=1; }); }))
    .then(()=>{ packFixing=false; if(typeof invalidate==='function') invalidate(); if(typeof paintHero==='function') paintHero(); }); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) setTimeout(packRepair,300); });
async function fetchPack(n){                                  // streamed so the loading bar is real, not a guess
  const r=await fetch(packURL(n),{cache:'force-cache'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const total=(PACKS[n]&&PACKS[n].b)||0;
  if(!r.body||!r.body.getReader||!total){ PK_PROG[n]=.9; return r.json(); }
  const rd=r.body.getReader(), chunks=[]; let got=0;
  for(;;){ const {done,value}=await rd.read(); if(done) break; chunks.push(value); got+=value.length; PK_PROG[n]=Math.min(.99,got/total); }
  const buf=new Uint8Array(got); let o=0; for(const c of chunks){ buf.set(c,o); o+=c.length; }
  return JSON.parse(new TextDecoder().decode(buf));
}
function loadPack(n){
  if(packReady(n)) return Promise.resolve();
  if(PK_Q[n]) return PK_Q[n];
  PK_PROG[n]=0;
  return PK_Q[n]=fetchPack(n).then(o=>decodePack(o,n)).then(()=>{ PK_DONE[n]=1; PK_PROG[n]=1; delete PK_Q[n]; if(typeof paintHero==='function') paintHero(); })
    .catch(e=>{ delete PK_Q[n]; packErr=n; throw e; });
}
const missionPack=id=>'m'+id;
function withPack(n,fn,label){                                // run fn once the pack is in, showing a loading card meanwhile
  if(packReady(n)){ fn(); return; }
  packLoad={n,label:label||'LOADING',t:0};
  loadPack(n).then(()=>{ packLoad=null; fn(); }).catch(()=>{ packLoad=null; if(typeof flashMsg==='function') flashMsg('COULD NOT LOAD THAT ART - CHECK YOUR CONNECTION'); });
}

function loadImgs(){                                           // boot: the page needs core before it can draw anything

}

function sfx(f,d,type='square',v=0.04,slide=0){
  if(muted||!AC) return;
  try{
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

function musicTick(dt){
  if(!AC||AC.state!=='running'||!MUS.mg) return;
  const menuMode=state==='layout'||state==='title'||state==='custom'||state==='shop'||state==='store'||state==='challenges'||state==='missions'||state==='enemies'||state==='loadout'||state==='stats'||state==='saves'||state==='win'||(state==='settings'&&settingsFrom!=='pause');
  const want=menuMode?'menu':'b'+(((stage-1+(M.id-1)*3)%NBATTLE)+NBATTLE)%NBATTLE;   /* 8 tracks, rotated by stage and shifted per mission */
  if(want!==MUS.want){ MUS.want=want; switchMusic(want); }
  startMusic();
  const lv=musicLevel(); MUS.mg.gain.value+=(lv-MUS.mg.gain.value)*Math.min(1,dt*4);
  if(MUS.el){ if(!MUS.elSrc) MUS.el.volume=Math.max(0,Math.min(1,MUS.mg.gain.value)); if(lv<=0&&MUS.mg.gain.value<.01){ if(!MUS.el.paused) MUS.el.pause(); } else if(lv>0&&MUS.el.paused) MUS.el.play().catch(()=>{}); }   /* music off = the streamed track is paused outright */
}
document.addEventListener('visibilitychange',()=>{ try{ if(!AC) return; if(document.hidden) AC.suspend(); else AC.resume(); if(MUS.el){ if(document.hidden) MUS.el.pause(); else if(musicLevel()>0) MUS.el.play().catch(()=>{}); } }catch(e){} });

   New, the classic pull-then-push: the shot flies out and opens a black hole where it touches an enemy (or at the end of its range).
   For about a second it sucks everything nearby in, lifting and spinning them off the street; then it implodes - shockwave, hit-stop, shake -

/* ---------- TRAINING ROOM v2 (2026-11-22, Sean: "everyone should get into training, in the levels they have access to, with all the guns, missiles,
   everything, easier enemies, a longer street, and tips and tricks"). Opens in any world you have unlocked (the one picked on BATTLE, or the newest open
   one); WORLD switches between your open worlds. You can't die, enemies are weaker (TRAIN_DF in 05b), every gun is loaded with full ammo, the Mk3 jetpack
   has endless fuel and missiles, every lethal is stocked, and the picker swaps any vehicle or strike. TIPS opens the illustrated How to Play guide.
   Your real strikes, lethals and saved run are kept safe: saveProfile writes the backups in TRAIN.stk / TRAIN.leth, and saveRun is off while training. ---------- */
const TR_X0=240, TR_X1=9000, TR_VEH=['bike','truck','bullet','tank'];

  'Strikes: tap a STRIKE button, hold to aim','Shotguns shred up close, snipers pierce a line','Break mystery boxes for vehicles and strikes','Every house has a LOADOUT PC inside'];
let trBtns=[];
const trWorlds=()=>MISSIONS.filter(m=>!m.soon&&misOpen(m.id)).map(m=>m.id);

  const W_=trWorlds(), b=typeof bmCur==='function'?bmCur():1; m=m||(W_.includes(b)?b:W_[W_.length-1]||1); TRAIN.m=m; TRAIN.live=false; startMission(m,false); }

  if(!TRAIN.leth) TRAIN.leth=JSON.parse(JSON.stringify(prof.leth||{})); prof.leth={}; LETH.forEach(L=>prof.leth[L.id]=LCAP);
  for(let i=0;i<NG;i++){ owned[i]=true; ammo[i]=GUNS[i].max===Infinity?Infinity:eff(i).max; }

function trainPick(b){

function trainTick(dt){

  if(TRAIN.sel&&stkN(TRAIN.sel)<SMAX){ prof.stk={[TRAIN.sel]:SMAX}; prof.stkCur=TRAIN.sel; }   /* the picked strike refills after each use */
  if(ammo[p.gun]!==Infinity&&ammo[p.gun]<eff(p.gun).max*.5) ammo[p.gun]=eff(p.gun).max;    /* guns, jetpack and lethals never run dry */
  p.jet.fuel=Math.max(p.jet.fuel,fuelMax(p.jet.tier)*.6); if(p.jet.mis<MIS[3]) p.jet.mis=MIS[3]; LETH.forEach(L=>{ if((prof.leth[L.id]|0)<LCAP) prof.leth[L.id]=LCAP; });

/* ===== GRAPHICS POLISH PASS (2026-11-22, Sean: "audit it ... do all 5 in order").

      Light ground -> dark ink line; dark ground -> warm light rim. Picked per location from the ground picture's average brightness.
      How: the character is drawn into a small scratch canvas (device pixels, same transform), a one-colour silhouette is made from it,
      the silhouette is stamped 8 times around the character, then the character goes on top. ?norim turns it off for testing.

   3. GRADE: location colour grades used to be painted on top (a coloured fog that greyed everything). Dark grades now MULTIPLY

   the dark tyre pixels in each wheel's ring are cut out once into their own layer, then every frame that layer is drawn rotated and masked

/* TANK TREADS (Sean 2026-11-22: "make the chains on the bottom of the tank look like they're moving"): the five road wheels and the two
   sprockets spin (cut from the picture and turned, like the monster truck), and the bottom run of track links slides backwards under the
   tank as it drives, so the chain reads as rolling. Positions measured on art/veh_tank.png (crop box 9..1014 x 24..651). */
const TK_BOX=[9,24,1005,627], TK_WH=[[210,562,53],[345,562,53],[480,562,53],[615,562,53],[752,562,53],[103,520,46],[872,520,46]], TK_RUN=[150,612,835,652,34.2];
function tankTreads(im,ww,h,kick){ const k=ww/TK_BOX[2], X=v=>-ww/2+kick+(v-TK_BOX[0])*k, Y=v=>-h+(v-TK_BOX[1])*k, sk=im.width/TK_BOX[2], SX=v=>(v-TK_BOX[0])*sk, SY=v=>(v-TK_BOX[1])*sk;
  const travel=(veh.wa||0)*VEH.tank.h*.2;
  TK_WH.forEach(([x,y,r])=>{ const cx=X(x), cy=Y(y), rr=r*k; ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,rr,0,7); ctx.clip(); ctx.translate(cx,cy); ctx.rotate(travel/rr); ctx.drawImage(im,SX(x-r),SY(y-r),2*r*sk,2*r*sk,-rr,-rr,2*rr,2*rr); ctx.restore(); });
  const [x0,y0,x1,y1,pt]=TK_RUN, off=((travel/k)%pt+pt)%pt; ctx.save(); ctx.beginPath(); ctx.rect(X(x0),Y(y0),(x1-x0)*k,(y1-y0)*k); ctx.clip();
  ctx.drawImage(im,SX(x0),SY(y0),(x1-x0)*sk,(y1-y0)*sk,X(x0)-off*k,Y(y0),(x1-x0)*k,(y1-y0)*k); ctx.drawImage(im,SX(x0),SY(y0),pt*sk,(y1-y0)*sk,X(x1)-off*k,Y(y0),pt*k,(y1-y0)*k); ctx.restore(); }

  ctx.fillStyle='#a8ff70'; ctx.beginPath(); ctx.moveTo(-.3*s,-.42*s); ctx.lineTo(.3*s,-.42*s); ctx.lineTo(.2*s,-.12*s); ctx.lineTo(-.2*s,-.12*s); ctx.closePath(); ctx.fill();

// today's dailies: 5 picked from the pool by the date, so everyone gets the same five and they change at midnight UTC

   - SUPPLY BOXES: the old supply / elite boxes as big tiles, plus one free box a day by watching an ad on CrazyGames / Poki.
