  if(fx.grav){ const big=fx.grav>=2.5, R=big?340:230; zs.forEach(w=>{ if(w.dead||w===z) return; const dx=x-w.x; if(Math.abs(dx)<R&&inLane(z,w,big?140:90)){ w.kb+=Math.sign(dx)*Math.min(big?260:150,Math.abs(dx)*.8*fx.grav); if(big) w.slow=Math.max(w.slow||0,1.6); } }); if(big) z.slow=Math.max(z.slow||0,1.6); hitSfx('pull'); }
  if(g.chain&&!noChain) chainArc({g,dmg},z,g.chain); }

  if(g.boom&&!g.splash) explode(b.x,b.y,{splash:g.boom},b.dmg*.5,b.ld,g);
  if(z.dead||z.hp<=0) onKill(g,z); }

function pickGun(excl){ const l=[]; for(let i=1;i<NG;i++){ if(owned[i]||isPrest(i)||(excl&&excl.includes(i))) continue; const w=i<10?3:i>=18?((prof.level>=gunLv(i)-3||stage>=gunLv(i)/2.5)?1.2:0):i<14?((stage>=3||M.id>=2)?1.3:0):((stage>=6||M.id>=4)?.5:0); if(w>0) l.push([i,w]); }

  { const g0={house:[6,14],car:[6,14],dumpster:[4,9],locker:[12,24],cache:[18,36]}[c.type]||[5,10], gv=(g0[0]+Math.random()*(g0[1]-g0[0]))*(1+.08*stage)*scavMul();

function rrr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* ---------- SAVE TRANSFER: move your progress to another phone or browser with a save code or a save file. No server needed;
   automatic cloud sync comes later with an online account. ---------- */
const SAVEKEYS=k=>k==='deadstreet_profile_v1'||/^ds_/.test(k);
function saveBlob(){ const o={}; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(SAVEKEYS(k)) o[k]=localStorage.getItem(k); } }catch(e){} return {v:1,t:Date.now(),d:o}; }
const b64u=u8=>{ let s=''; for(let i=0;i<u8.length;i+=8192) s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const u8b64=s=>{ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; const b=atob(s), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; };
async function packSave(){ const raw=new TextEncoder().encode(JSON.stringify(saveBlob()));
  if(window.CompressionStream){ try{ const z=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()); return 'DS1.'+b64u(z); }catch(e){} }
  return 'DS0.'+b64u(raw); }
async function unpackSave(code){ code=String(code||'').trim().replace(/\s+/g,''); const tag=code.slice(0,4), body=code.slice(4); let u=u8b64(body);
  if(tag==='DS1.'){ u=new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()); } else if(tag!=='DS0.') throw new Error('not a Dead Street save');
  const o=JSON.parse(new TextDecoder().decode(u)); if(!o||o.v!==1||!o.d||!o.d.deadstreet_profile_v1) throw new Error('empty save'); return o; }
function saveNotice(){ if(SAVELOCK==='newer') return ['NEWER SAVE FOUND  -  RELOAD TO UPDATE  (NOT SAVING)','#ff8a6a'];
  if(SAVELOCK==='unreadable') return ['SAVE UNREADABLE  -  SEE SETTINGS > SAVE TRANSFER  (NOT SAVING)','#ff8a6a'];
  if(SAVELOCK==='blocked') return ['THIS BROWSER IS BLOCKING SAVES  (NOT SAVING)','#ff8a6a'];
  if(profFrom==='backup') return ['SAVE WAS DAMAGED  -  LAST GOOD SAVE RESTORED','#bff08a']; if(lvCatch) return [lvCatch+'  -  CARDS ARE IN GEAR','#bff08a']; return null; }
function startFresh(){ if(!confirm('Your old save could not be read.\n\nStart a fresh profile? The damaged save is kept aside (not deleted) in case it can be recovered.')) return; try{ const raw=localStorage.getItem(PKEY); if(raw) localStorage.setItem(PKEY+'_damaged',raw); localStorage.removeItem(PKEY); }catch(e){} location.reload(); }
function applySave(o){ /* the progress being replaced is kept aside first (PKEY+'_preimport') */ let pr={}; try{ pr=JSON.parse(o.d.deadstreet_profile_v1); }catch(e){}
  if(!confirm('Load this save?\n\nLevel '+(pr.level||1)+'  -  '+(pr.gold||0)+' gold  -  '+(pr.gems||0)+' gems\nsaved '+new Date(o.t).toLocaleString()+'\n\nThis replaces the progress on this device.')) return;
  try{ const cur=localStorage.getItem(PKEY); if(cur) localStorage.setItem(PKEY+'_preimport',cur); Object.keys(o.d).forEach(k=>{ if(SAVEKEYS(k)) localStorage.setItem(k,o.d[k]); }); }catch(e){ alert('Could not write the save: '+e.message); return; } location.reload(); }
let saveMsg=null;
const sMsg=t=>{ saveMsg={t,until:performance.now()+5000}; };
async function saveCopy(){ saveProfile(); const c=await packSave(); try{ await navigator.clipboard.writeText(c); sMsg('SAVE CODE COPIED  -  '+c.length+' characters. Paste it on the other device.'); }catch(e){ prompt('Copy this save code:',c); } }
async function saveDownload(){ saveProfile(); const c=await packSave(), a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([c],{type:'text/plain'})); a.download='dead-street-save-'+new Date().toISOString().slice(0,10)+'.dssave'; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); sMsg('SAVE FILE DOWNLOADED'); }

/* ---------- MILESTONES, WEEKLIES & ACHIEVEMENT POP-UPS (Sean, 2026-11-21) ----------

const careerLv=()=>(prof.prest||0)*120+prof.level;
const mileVal=T=>T.kind==='career'?careerLv():Math.max((prof.st&&prof.st[T.kind])||0,T.kind==='kills'&&prof.chal?prof.chal.lkills||0:0);   /* kills: the older lifetime counter can be ahead of STATS on long-time saves */
function mileTier(T){ const m=prof.mile||(prof.mile={}); if(T.id==='kills'&&m.kills==null&&prof.chal&&prof.chal.claimed&&prof.chal.claimed.l_kill) m.kills=1; return m[T.id]||0; }   /* the old 1,000-kill Slayer counts as tier I */
