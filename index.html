function genStage(s, rngSeedBump=0){

  zs=[];bullets=[];slimes=[];parts=[];drops=[];floats=[];missiles=[];obst=[];coins=[];

  const xs=[]; for(let k=0;k<6;k++) xs.push(540+k*((WORLD-1080)/5)+(rng()-.5)*120);
  xs.sort((a,b)=>a-b);
  // gun container = the one closest to the start point (x=320)
  let gi=0; xs.forEach((x,i)=>{ if(Math.abs(x-320)<Math.abs(xs[gi]-320)) gi=i; });
  const rest=kinds.slice(1).sort(()=>rng()-.5); let ri=0;

  const aspect=(n,w,lo,hi,dflt)=>{ const im=IM[n]; return im?Math.max(lo,Math.min(hi,Math.round(w*im.height/im.width))):dflt; };

  const gaps=[852,1476,2100,2724,3348];                                  // midpoints between the houses/cars

  { const x0=gaps[1]-170; addP('crate',x0,70,64); addP('crate',x0+86,70,128); const bh=addP('bus',x0+210,190,aspect('plat_bus',190,84,125,108)); conts.push({x:x0+210,y:GROUND-bh,type:'cache',kind:'cache',done:false}); }
  // course B: rubble -> stack of 2 -> stack of 3 (cache on top)
  { const x0=gaps[3]-150, rh=aspect('plat_rubble',120,40,70,56); addP('rubble',x0,120,rh); addP('crate',x0+120,70,128); addP('crate',x0+206,70,192); conts.push({x:x0+206,y:GROUND-192,type:'cache',kind:'cache',done:false}); }
  // hazards on the road (jump over them, or lure zombies into them) + one explosive barrel near each

  });

      dmg:g.dmg*(p.slime>0?.5:1)*(p.pk.dmg>0?2:1)*dmgMul(),life:g.life*(g.flame?rnd(.7,1):1),pierce:g.pierce,hit:new Set(),g,r:g.flame?12:(g.splash?7:3)});

function spr(img,cx,feet,h,flip,filter){
  if(!img) return false;
  const w=img.width*h/img.height;
  ctx.save(); if(filter) ctx.filter=filter;
  ctx.translate(cx,feet); if(flip) ctx.scale(-1,1);
  ctx.drawImage(img,-w/2,-h,w,h); ctx.restore(); return true;
}
const ANIM={ slow:{rate:5.5,shear:.22,sway:.04,bob:2,lean:.03}, fast:{rate:14,shear:.42,sway:.05,bob:4.5,lean:.17}, spitter:{rate:6.5,shear:.18,sway:.07,bob:2.5,lean:.02} };
// walk-cycle from one still sprite: legs swing from the hip, torso bobs/sways/leans over them
function aspr(img,cx,feet,h,flip,a,filter){
  if(!img) return false;
  const w=img.width*h/img.height, ox=-w*(a.ax==null?.5:a.ax), r=a.split||.6, th=h*r, bh=h-th, sy=img.height*r, s=Math.sin(a.ph), ab=Math.abs(s);

  ctx.translate(cx,feet); if(flip) ctx.scale(-1,1);
  // legs: pivot at the hip, feet swing and lift
  ctx.save(); ctx.translate(0,-bh); ctx.transform(1,0,s*a.shear,1-.05*ab,0,0);
  ctx.drawImage(img,0,sy-2,img.width,img.height-sy+2,ox,-2*h/img.height,w,bh+2*h/img.height); ctx.restore();
  // torso: pivots at the hip
  ctx.save(); ctx.translate(0,-bh-ab*a.bob); ctx.rotate(a.fwd*a.lean+Math.sin(a.ph*2)*a.sway*.6+s*a.sway*.4);
  ctx.drawImage(img,0,0,img.width,sy,ox,-th,w,th); ctx.restore();
  ctx.restore(); return true;
}

/* ---------- input ---------- */
const MAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'fire',KeyJ:'fire',KeyK:'fire',KeyE:'use'};
function startNew(){ owned=[true,...Array(9).fill(false)]; ammo=GUNS.map(g=>g.max===Infinity?Infinity:0); p=null; startStage(1); }
function startCont(){ owned=[true,...Array(9).fill(false)]; ammo=GUNS.map(g=>g.max===Infinity?Infinity:0);
  // continuing grants the guns a player would plausibly have found by that stage
  for(let i=1;i<Math.min(10,bestStage);i++){ owned[i]=true; ammo[i]=Math.ceil(GUNS[i].max*.5); }
  pendingJet=bestStage>=10?3:bestStage>=6?2:bestStage>=3?1:0;
  p=null; startStage(bestStage); }
addEventListener('keydown',e=>{
  initAudio();
  if(MAP[e.code]){ keys[MAP[e.code]]=true; if(MAP[e.code]==='use'&&!e.repeat) keys._usePressed=true; if(e.code==='Space'||e.code.startsWith('Arrow')) e.preventDefault(); }
  if(MENU[state]||state==='win'){ if(state==='title'||state==='win'){ if(e.code==='Enter'||e.code==='Space'){ startNew(); } if(e.code==='KeyC'&&state==='title'&&bestStage>1) startCont(); } else if(e.code==='Escape'||(state==='pause'&&e.code==='KeyP')){ if(state==='settings') state=settingsFrom; else if(state==='pause') state='play'; else state='title'; } return; }
  if(e.code==='KeyP'||e.code==='Escape'){ if(state==='play'){ state='pause'; releaseKeys(); } else if(state==='pause') state='play'; }
  if(e.code==='KeyM'){ muted=!muted; prof.muted=muted; saveProfile(); }
  if(state!=='play') return;
  if(e.code.startsWith('Digit')){ const n=+e.code.slice(5); selectGun(n===0?9:n-1); }
  if(e.code==='KeyQ') cycleGun(-1); if(e.code==='KeyR') cycleGun(1);
  if((e.code==='KeyF'||e.code==='KeyX')&&!e.repeat) keys._missPressed=true;
});
addEventListener('keyup',e=>{ if(MAP[e.code]) keys[MAP[e.code]]=false; });
addEventListener('blur',()=>{ Object.keys(keys).forEach(k=>keys[k]=false); mouse.down=false; if(state==='play') state='pause'; });
cv.addEventListener('contextmenu',e=>e.preventDefault());
const ptrs=new Map(), HOLD={left:1,right:1,jump:1,fire:1,use:1};
function toLogical(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]; }
function btnAt(x,y){ const l=pbtns(); for(let i=l.length-1;i>=0;i--){ const b=l[i]; if(b.show===false) continue;
  if(b.rect?(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h):Math.hypot(x-b.x,y-b.y)<=b.r+10) return b; } return null; }
function pressBtn(b){ const k=b.k;
  if(k==='pause'){ if(state==='play'){ state='pause'; releaseKeys(); ptrs.clear(); joy=null; } else if(state==='pause') state='play'; return; }
  if(state!=='play') return;
  if(k==='next') cycleGun(1); else if(k==='msl') keys._missPressed=true; else if(k.startsWith('gun')) selectGun(b.i);
  else { keys[k]=true; if(k==='use') keys._usePressed=true; } }
function releaseBtn(b){ if(b&&HOLD[b.k]) keys[b.k]=false; }
function portDown(e){ const [x,y]=toLogical(e), b=btnAt(x,y); if(!b){ if(state==='play'&&!joy&&joyStart(e,x,y)){ ptrs.set(e.pointerId,{k:'joy'}); try{cv.setPointerCapture(e.pointerId);}catch(_){ } } return; } ptrs.set(e.pointerId,b); try{cv.setPointerCapture(e.pointerId);}catch(_){ } pressBtn(b); }
function portMove(e){ if(joy&&joy.id===e.pointerId){ joyMove(e); return; } if(!ptrs.has(e.pointerId)) return; const old=ptrs.get(e.pointerId); if(!HOLD[old.k]) return; const [x,y]=toLogical(e), nb=btnAt(x,y);
  if(nb!==old){ releaseBtn(old); if(nb&&HOLD[nb.k]){ ptrs.set(e.pointerId,nb); pressBtn(nb); } else ptrs.delete(e.pointerId); } }
function portUp(e){ if(joy&&joy.id===e.pointerId){ joy=null; ptrs.delete(e.pointerId); return; } const b=ptrs.get(e.pointerId); if(b){ releaseBtn(b); ptrs.delete(e.pointerId); } }
cv.addEventListener('pointermove',portMove); cv.addEventListener('pointerup',portUp); cv.addEventListener('pointercancel',portUp);
function mpos(e){ const r=cv.getBoundingClientRect(); mouse.x=(e.clientX-r.left)*W/r.width; mouse.y=(e.clientY-r.top)*H/r.height; mouse.seen=true; }
cv.addEventListener('pointermove',mpos);

let last=performance.now();

}
